name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Pin npm
        # The npm bundled with the runner's default Node 22 build is older
        # than the npm that wrote this lockfile and rejects the platform-
        # gated optionalDependencies entries for tsx's nested esbuild
        # (EBADPLATFORM). 11.x handles them correctly.
        run: npm install -g npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build (editor + standalone + viewer templates)
        # build:all also produces dist/{standalone,viewer}-template.html so the
        # in-editor Save / Export → HTML can fetch them at runtime.
        run: npm run build:all

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
